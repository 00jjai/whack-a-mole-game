        function drawGrass(x, y) {
            stroke(30, 110, 30);

            line(x, y, x - 4, y - 10);
            line(x, y, x, y - 14);
            line(x, y, x + 4, y - 10);
            noStroke();
        }

        function drawHole(cx, cy) {
            fill(107, 61, 20, 130);

            fill(13, 6, 4);
            ellipse(cx, cy, 56, 20);
        }
